name: emap setup tests
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop, sk/waveform-dev ]
  repository_dispatch:
permissions:
  contents: read
  checks: write
  id-token: write
  pull-requests: read # needed by paths-filter
jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      emap-setup: ${{ steps.filter.outputs.emap-setup }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            emap-setup:
              - '.github/**'
              - 'emap-checker.xml'
              - 'emap-setup/**'
  emap-setup-tests:
    needs: [filter]
    runs-on: ubuntu-latest
    if: needs.filter.outputs.emap-setup == 'true'
    steps:
      # emap-setup test performs clones of private repos as part of the test, so
      # a token is needed to be able to do that
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SAFEHR_WORKER_APP_ID }}
          private-key: ${{ secrets.SAFEHR_WORKER_APP_KEY }}
      - uses: actions/checkout@v3
      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: "pip"
      - name: Install Python Dependencies
        run: | 
          python -m pip install -r emap-setup/requirements.txt
      - name: Run tests
        with:
          token: ${{ steps.generate-token.outputs.token }}
        run: |
          cd emap-setup
          pytest  --cov=./ --cov-report=term
